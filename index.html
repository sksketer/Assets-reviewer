<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprite Assets Viewer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="toolbar-brand">Sprite Assets Viewer</div>
      <div class="toolbar-actions">
        <button id="btn-add-sprite" type="button" class="toolbar-btn">+ Sprite</button>
        <button id="btn-add-animation" type="button" class="toolbar-btn">+ Animation</button>
        <button id="btn-clear" type="button" class="toolbar-btn toolbar-btn--ghost">Clear Stage</button>
      </div>
    </header>

    <main id="canvas-container">
      <div id="drop-hint">Select "+ Sprite" or "+ Animation", then choose files or drag &amp; drop them here.</div>
    </main>

    <footer id="status-bar">Ready.</footer>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Invalid Assets</h2>
      <p id="modal-message"></p>
      <button id="modal-close" type="button" class="toolbar-btn">Close</button>
    </div>
  </div>

  <div id="anim-config-overlay" class="modal-overlay">
    <div class="modal anim-config-modal" role="dialog" aria-modal="true" aria-labelledby="anim-config-title">
      <h2 id="anim-config-title">Configure Animation</h2>
      <div class="anim-config-body">
        <div class="inspector-row">
          <label for="anim-config-speed" class="inspector-label">Speed</label>
          <div class="inspector-speed-control">
            <input id="anim-config-speed" type="range" min="0.01" max="1" step="0.01" value="0.15" />
            <span id="anim-config-speed-value" class="inspector-speed-value">0.15x</span>
          </div>
        </div>
        <div class="inspector-select-row">
          <label for="anim-config-default-frame" class="inspector-label">Default frame (shown when stopped)</label>
          <select id="anim-config-default-frame" class="inspector-select"></select>
        </div>
        <div class="inspector-select-row">
          <span class="inspector-label">Frames to include in the animation loop</span>
          <div id="anim-config-frames" class="inspector-frames-list anim-config-frames-list"></div>
        </div>
      </div>
      <div class="anim-config-actions">
        <button id="anim-config-cancel" type="button" class="toolbar-btn toolbar-btn--ghost">Cancel</button>
        <button id="anim-config-confirm" type="button" class="toolbar-btn">Create Animation</button>
      </div>
    </div>
  </div>

  <div id="inspector-panel" class="inspector-panel hidden">
    <div id="inspector-header" class="inspector-header">
      <span id="inspector-title" class="inspector-title">Sprite</span>
      <button id="inspector-close" type="button" class="inspector-close" aria-label="Close panel">&times;</button>
    </div>
    <div class="inspector-body">
      <div class="inspector-row">
        <span class="inspector-label">Source</span>
        <span id="inspector-source" class="inspector-value"></span>
      </div>
      <div class="inspector-row">
        <span class="inspector-label">Type</span>
        <span id="inspector-type" class="inspector-value"></span>
      </div>
      <div class="inspector-row">
        <span class="inspector-label">File size</span>
        <span id="inspector-filesize" class="inspector-value"></span>
      </div>
      <div class="inspector-row">
        <span class="inspector-label">Dimensions</span>
        <span id="inspector-dimensions" class="inspector-value"></span>
      </div>
      <div class="inspector-row">
        <span class="inspector-label">GPU memory (est.)</span>
        <span id="inspector-gpu" class="inspector-value"></span>
      </div>
      <div class="inspector-row">
        <span class="inspector-label">Current frame</span>
        <span id="inspector-frame" class="inspector-value"></span>
      </div>
      <div id="inspector-playback-row" class="inspector-row hidden">
        <span class="inspector-label">Playback</span>
        <button id="inspector-play-toggle" type="button" class="toolbar-btn toolbar-btn--ghost inspector-play-btn">Pause</button>
      </div>
      <div id="inspector-speed-row" class="inspector-row hidden">
        <label for="inspector-speed" class="inspector-label">Speed</label>
        <div class="inspector-speed-control">
          <input id="inspector-speed" type="range" min="0.01" max="1" step="0.01" />
          <span id="inspector-speed-value" class="inspector-speed-value"></span>
        </div>
      </div>
      <div id="inspector-frame-select-row" class="inspector-select-row hidden">
        <label for="inspector-frame-select" class="inspector-label">Jump to frame</label>
        <select id="inspector-frame-select" class="inspector-select"></select>
      </div>
      <div id="inspector-frames-row" class="inspector-select-row hidden">
        <span class="inspector-label">Frames in animation</span>
        <div id="inspector-frames-list" class="inspector-frames-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
